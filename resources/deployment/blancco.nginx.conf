server {
    listen 80;
    listen [::]:80;
    server_name blancco.amso365.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blancco.amso365.com;
    root /var/www/blancco/public;
    index index.php;
    ssl_certificate /etc/letsencrypt/live/amso365.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amso365.com/privkey.pem;
    access_log /var/log/nginx/blancco.access.log;
    error_log /var/log/nginx/blancco.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    client_max_body_size 10m;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
